# Validate debug and release builds on every working branch.
# CI never pushes to the default branch or opens pull requests.
name: Android CI & Signed Release

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint (debug and release)
        run: bash ./gradlew :app:lintDebug :app:lintRelease --stacktrace

      - name: Run unit tests (all modules, debug and release)
        run: bash ./gradlew :core:model:test :core:domain:test :core:data:testDebugUnitTest :core:data:testReleaseUnitTest :app:testDebugUnitTest :app:testReleaseUnitTest --stacktrace

      - name: Assemble debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace

      # Release signing uses the v2 identity (RELEASE_*_V2 secrets). Pull
      # request builds never receive secrets and validate an unsigned APK;
      # push builds require the v2 secrets and fail hard without them.
      - name: Assemble release APK
        env:
          RELEASE_KEYSTORE_BASE64_V2: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEYSTORE_BASE64_V2 || '' }}
          RELEASE_STORE_PASSWORD_V2: ${{ github.event_name != 'pull_request' && secrets.RELEASE_STORE_PASSWORD_V2 || '' }}
          RELEASE_KEY_ALIAS_V2: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEY_ALIAS_V2 || '' }}
          RELEASE_KEY_PASSWORD_V2: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEY_PASSWORD_V2 || '' }}
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/ai-cloud-release-v2.p12"
          trap 'rm -f "$keystore"' EXIT
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "::warning::Pull request build: signing secrets are not exposed. Building an unsigned release APK for validation only."
            echo "Release APK: unsigned (PR validation build)." >> "$GITHUB_STEP_SUMMARY"
          else
            missing=0
            for v in RELEASE_KEYSTORE_BASE64_V2 RELEASE_STORE_PASSWORD_V2 RELEASE_KEY_ALIAS_V2 RELEASE_KEY_PASSWORD_V2; do
              if [[ -z "${!v:-}" ]]; then
                echo "::error::Required signing secret '$v' is missing. Refusing to produce an unsigned release APK."
                missing=1
              fi
            done
            if [[ "$missing" != "0" ]]; then exit 1; fi
            umask 077
            printf '%s' "$RELEASE_KEYSTORE_BASE64_V2" | base64 --decode > "$keystore"
            export RELEASE_STORE_FILE="$keystore"
            echo "Release APK: signed with the v2 release key." >> "$GITHUB_STEP_SUMMARY"
          fi
          bash ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # Release verification: signature chain + public cert digests + checksum.
      # On pull_request builds there is nothing signed — verify is skipped.
      - name: Verify APK signature and record certificate fingerprint
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK" > /tmp/apksigner-verbose.txt
          grep -E "^Verified using" /tmp/apksigner-verbose.txt || true
          echo "## Signed release APK (v2 identity)" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            "$APKSIGNER" verify --print-certs "$APK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compute APK SHA-256 checksum
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          {
            echo '```'
            echo "sha256: $SHA"
            echo "size:   $SIZE bytes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # The only artifact that ships to users: the SIGNED release APK.
      # Keystores, passwords and temporary files are never uploaded.
      - name: Upload signed release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ai-cloud-release-signed-v2
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  connected-tests:
    name: Connected Android Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload connected test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-results
          path: app/build/outputs/androidTest-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    name: Dependency Review (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  notify-failure:
    name: Notify on Failure
    needs: [build, connected-tests, dependency-review]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && (needs.build.result == 'failure' || needs.connected-tests.result == 'failure' || needs.dependency-review.result == 'failure') }}
    steps:
      - name: Report failure
        run: |
          echo "::warning::Android CI failed. Inspect the failed job and uploaded reports."
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
