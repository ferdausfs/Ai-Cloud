# Android CI + Auto-merge for RepoChat (Ai-Cloud)
# Triggers on pushes to ANY branch (includes ai-chat/* working branches) and on pull requests.
# When the working branch (ai-chat/*) passes build + tests, it is auto-merged into main.
# main-e NEVER directly pushed — only ai-chat/* → main merge is allowed.

name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          dependency-graph: generate-and-submit

      - name: Decrypt secrets (if needed)
        run: echo "Add secret decryption here if using encrypted secrets"
        # Example for encrypted secrets:
        # - name: Decrypt secrets
        #   run: gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.SECRETS_PASSPHRASE }}" --output local.properties secrets.gpg

      - name: Run lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests (all modules)
        run: ./gradlew :core:model:test :core:domain:test :core:data:testDebugUnitTest :app:testDebugUnitTest --stacktrace

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**/*.xml
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # Optional: Connected Android Tests on emulator
  connected-tests:
    name: Connected Android Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Start emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          force-avd-creation: false
          # 32-bit x86 system images are no longer published for API 34; use the
          # 64-bit image which sdkmanager can resolve (system-images;...;x86_64).
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload connected test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-results
          path: app/build/outputs/androidTest-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  # Dependency vulnerability scan
  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        env:
          # The action runs inside its own Docker image which already bundles a
          # JDK. The host JAVA_HOME points at a tool-cache path that is not
          # mounted inside the container, so clear it and let the container
          # resolve its own Java instead of failing with "JAVA_HOME is not
          # defined correctly".
          JAVA_HOME: ""
        with:
          project: 'RepoChat'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --suppression suppression.xml

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check-report.html
          if-no-files-found: ignore
          retention-days: 30

  # Auto-merge: once the working branch is GREEN (build + tests pass),
  # merge it into main automatically — no direct push to main ever.
  merge-to-main:
    name: Auto-merge into main when green
    needs: [build, connected-tests, dependency-check]
    # ONLY ai-chat/** branches are allowed to merge into main automatically.
    # main, master, or any other branch name will NOT trigger this job.
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/ai-chat/') &&
      (needs.build.result == 'success' &&
       needs.connected-tests.result == 'success' &&
       needs.dependency-check.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge working branch into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.ref_name }}"
          git merge --no-ff "origin/${{ github.ref_name }}" -m "Auto-merge ${{ github.ref_name }} after green CI"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Notify on failure
  notify-failure:
    name: Notify on Failure
    if: failure()
    needs: [build, connected-tests, dependency-check]
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "::warning::Build failed on branch ${{ github.ref_name }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # Add Slack/Discord/email notification here if desired
      # - name: Slack notification
      #   uses: 8398a7/action-slack@v3
      #   with:
      #     status: failure
      #     webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}