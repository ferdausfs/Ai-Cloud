# Validate debug and release builds on every working branch.
# CI never pushes to the default branch or opens pull requests.
name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint (debug and release)
        run: bash ./gradlew :app:lintDebug :app:lintRelease --stacktrace

      - name: Run unit tests (all modules, debug and release)
        run: bash ./gradlew :core:model:test :core:domain:test :core:data:testDebugUnitTest :core:data:testReleaseUnitTest :app:testDebugUnitTest :app:testReleaseUnitTest --stacktrace

      - name: Assemble debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace

      # Never expose release signing secrets to pull request builds.
      # Without secrets, CI still validates and uploads an unsigned release APK.
      - name: Assemble release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEYSTORE_BASE64 || '' }}
          RELEASE_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RELEASE_STORE_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release-signing.jks"
          trap 'rm -f "$keystore"' EXIT
          if [[ -n "$RELEASE_KEYSTORE_BASE64" || -n "$RELEASE_STORE_PASSWORD" || -n "$RELEASE_KEY_ALIAS" || -n "$RELEASE_KEY_PASSWORD" ]]; then
            if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_STORE_PASSWORD" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
              echo "::error::Release signing is incomplete. Configure all four RELEASE_* signing secrets."
              exit 1
            fi
            umask 077
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            export RELEASE_STORE_FILE="$keystore"
            echo "Release APK: signed with the configured release key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Signing secrets are unavailable. Building an unsigned release APK; it must be signed before installation."
            echo "Release APK: unsigned; signing is required before installation." >> "$GITHUB_STEP_SUMMARY"
          fi
          bash ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  connected-tests:
    name: Connected Android Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload connected test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-results
          path: app/build/outputs/androidTest-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    name: Dependency Review (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  notify-failure:
    name: Notify on Failure
    needs: [build, connected-tests, dependency-review, release-on-tag]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && (needs.build.result == 'failure' || needs.connected-tests.result == 'failure' || needs.dependency-review.result == 'failure' || needs.release-on-tag.result == 'failure') }}
    steps:
      - name: Report failure
        run: |
          echo "::warning::Android CI failed. Inspect the failed job and uploaded reports."
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # Tag releases (audit addition): on v* tags, package the release APK and
  # publish a GitHub Release. Signs with the RELEASE_* secrets when all four
  # exist; otherwise signs with a throwaway debug key (filename clearly
  # suffixed -debugsigned) so the APK is installable for sideloading — this
  # path is for personal distribution, NOT the Play Store.
  release-on-tag:
    name: GitHub Release (tags)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_KEYSTORE_BASE64" || -n "$RELEASE_STORE_PASSWORD" || -n "$RELEASE_KEY_ALIAS" || -n "$RELEASE_KEY_PASSWORD" ]]; then
            if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_STORE_PASSWORD" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
              echo "::error::Release signing is incomplete. Configure all four RELEASE_* signing secrets."
              exit 1
            fi
            keystore="$RUNNER_TEMP/release-signing.jks"
            umask 077
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            export RELEASE_STORE_FILE="$keystore"
          fi
          bash ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Fallback-sign with a throwaway debug key (no secrets configured)
        if: env.RELEASE_KEYSTORE_BASE64 == ''
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          [ -d "$SDK" ] || SDK="/usr/local/lib/android/sdk"
          BT=$(ls -d "$SDK"/build-tools/*/ | sort | tail -n 1)
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias repochat -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass repochat -keypass repochat -dname "CN=RepoChat Debug, O=RepoChat, C=US" >/dev/null 2>&1
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$APK" ] || APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-pass pass:repochat --key-pass pass:repochat \
            --out "app/build/outputs/apk/release/app-release-debugsigned.apk" "$APK"
          rm -f "$APK"

      - name: Publish GitHub Release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/app-release*.apk | head -n 1)
          NAME="repochat-${GITHUB_REF_NAME}.apk"
          mv "$APK" "$NAME"
          gh release create "${GITHUB_REF_NAME}" "$NAME" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
