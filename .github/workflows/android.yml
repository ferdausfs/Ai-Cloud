# Validate debug and release builds on every working branch.
# CI never pushes to the default branch or opens pull requests.
name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint (debug and release)
        run: bash ./gradlew :app:lintDebug :app:lintRelease --stacktrace

      - name: Run unit tests (all modules, debug and release)
        run: bash ./gradlew :core:model:test :core:domain:test :core:data:testDebugUnitTest :core:data:testReleaseUnitTest :app:testDebugUnitTest :app:testReleaseUnitTest --stacktrace

      - name: Assemble debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace

      # PRs and non-tag builds without signing secrets validate release compilation
      # but never publish unsigned release APKs. Release tags require the existing
      # release key; never generate a replacement key for installed apps.
      - name: Assemble and verify release APK
        id: release
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          RELEASE_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEYSTORE_BASE64 || '' }}
          RELEASE_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RELEASE_STORE_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IS_PULL_REQUEST" == "true" ]]; then
            unset RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_STORE_FILE
            bash ./gradlew :app:assembleRelease --no-daemon --stacktrace
            echo "PR release compilation validated. No installable release APK is published from PR builds." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          configured=0
          for secret_name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -n "${!secret_name}" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -eq 0 && "$IS_RELEASE_TAG" != "true" ]]; then
            unset RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_STORE_FILE
            bash ./gradlew :app:assembleRelease --no-daemon --stacktrace
            echo "::warning::Release signing secrets are not configured. Release compilation was validated, but no release APK will be published."
            echo "Release compilation validated without signing secrets. For testing, download app-debug-apk. This debug APK is not a signed release and may not update an existing installation; its signing key is not stable across CI runners. No unsigned release APK is uploaded. Publishing a release tag requires all four RELEASE_* secrets with the existing app signing keystore." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for secret_name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing $secret_name. Release tags and partially configured signing require all four RELEASE_* signing secrets using the existing app signing keystore. Unsigned release publication and replacement keys are not allowed."
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/release-signing.jks"
          trap 'rm -f "$keystore"' EXIT
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          export RELEASE_STORE_FILE="$keystore"
          bash ./gradlew :app:assembleRelease --no-daemon --stacktrace

          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk" || -f app/build/outputs/apk/release/app-release-unsigned.apk ]]; then
            echo "::error::Expected only a signed release APK. Refusing to upload an unsigned release."
            exit 1
          fi
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" || ! -d "$sdk/build-tools" ]]; then
            echo "::error::Android SDK build-tools are unavailable for signature verification."
            exit 1
          fi
          apksigner=$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner was not found."
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release APK: signature verified, signed with the configured release key. Install app-release.apk from app-release-signed-apk. Updates require the same signing certificate as the installed app." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified signed release APK
        if: steps.release.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  connected-tests:
    name: Connected Android Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload connected test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-results
          path: app/build/outputs/androidTest-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    name: Dependency Review (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  notify-failure:
    name: Notify on Failure
    if: failure()
    needs: [build, connected-tests, dependency-review, release-on-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Report failure
        run: |
          echo "::warning::Android CI failed. Inspect the failed job and uploaded reports."
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # Publish the exact verified APK from the build job, without rebuilding or
  # re-signing it. A throwaway/debug key must never replace the release key.
  release-on-tag:
    name: GitHub Release (tags)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, connected-tests]
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download verified signed release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-signed-apk
          path: release-apk

      - name: Publish GitHub Release with the signed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APK="release-apk/app-release.apk"
          test -s "$APK"
          NAME="repochat-${GITHUB_REF_NAME}.apk"
          mv "$APK" "$NAME"
          gh release create "${GITHUB_REF_NAME}" "$NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
