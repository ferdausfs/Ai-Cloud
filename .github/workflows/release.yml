# Signed release APK pipeline.
#
# Runs on manual dispatch only. Everything is validated first (unit tests,
# lint, connected tests) and only then is the signed release APK built from
# the v2 signing identity stored in the RELEASE_*_V2 repository secrets.
#
# Hard rules enforced here:
# - The workflow FAILS if any signing secret is missing — no unsigned fallback.
# - The keystore is decoded ONLY into $RUNNER_TEMP and never leaves the runner
#   (not uploaded, not cached, removed in an always() cleanup step).
# - No secret value is ever printed; `apksigner verify --print-certs` prints
#   only public certificate digests.
# - Only the signed APK is uploaded as an artifact — never the keystore,
#   passwords, or temporary files.

name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Tests, lint, connected tests & signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_STORE_PASSWORD_V2: ${{ secrets.RELEASE_STORE_PASSWORD_V2 }}
      RELEASE_KEY_ALIAS_V2: ${{ secrets.RELEASE_KEY_ALIAS_V2 }}
      RELEASE_KEY_PASSWORD_V2: ${{ secrets.RELEASE_KEY_PASSWORD_V2 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fail fast if the v2 signing secrets are missing
        env:
          RELEASE_KEYSTORE_BASE64_V2: ${{ secrets.RELEASE_KEYSTORE_BASE64_V2 }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in RELEASE_KEYSTORE_BASE64_V2 RELEASE_STORE_PASSWORD_V2 RELEASE_KEY_ALIAS_V2 RELEASE_KEY_PASSWORD_V2; do
            if [[ -z "${!v:-}" ]]; then
              echo "::error::Required signing secret '$v' is not set. Refusing to build an unsigned release APK."
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode signing keystore into RUNNER_TEMP only
        env:
          RELEASE_KEYSTORE_BASE64_V2: ${{ secrets.RELEASE_KEYSTORE_BASE64_V2 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/ai-cloud-release-v2.p12"
          printf '%s' "$RELEASE_KEYSTORE_BASE64_V2" | base64 --decode > "$keystore"
          echo "RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "v2 keystore decoded into RUNNER_TEMP (contents never printed)."

      - name: Run unit tests (all modules)
        run: bash ./gradlew :core:model:test :core:domain:test :core:data:testDebugUnitTest :app:testDebugUnitTest --stacktrace

      - name: Run lint (debug and release)
        run: bash ./gradlew :app:lintDebug :app:lintRelease --stacktrace

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Build signed release APK
        run: bash ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and record certificate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK" > /tmp/apksigner-verbose.txt
          grep -E "^Verified|^Verified using" /tmp/apksigner-verbose.txt || true
          echo "## Signed release APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$APKSIGNER" verify --print-certs "$APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Compute APK SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          {
            echo "## APK checksum"
            echo '```'
            echo "sha256: $SHA"
            echo "size:   $SIZE bytes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-cloud-release-signed-v2
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore from the runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ai-cloud-release-v2.p12"

      - name: Upload test/lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
